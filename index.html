<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Stock Tracker</h1>

            <div class="search">
                <input id="tickerInput" type="text" placeholder="Введите тикер...">

                <button id="searchButton">Найти</button>
            </div>
        </header>


        <main>

            <div class="stock-card">

                <div class="stock-header">

                    <div>
                        <h2>SBERBANK</h2>
                        <p>SBER</p>
                    </div>

                    <button>☆</button>

                </div>


                <div class="stock-price">

                    <span>342.15 ₽</span>

                    <span class="positive">
                        +2.34%
                    </span>

                </div>


                <!-- График -->

                <div class="chart-container">

                    <canvas id="stockChart"></canvas>

                </div>


                <div class="periods">

                    <button>1D</button>
                    <button>1W</button>
                    <button>1M</button>
                    <button>1Y</button>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>

</html>
